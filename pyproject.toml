[project]
name = "loop-separated-alpha-audit"
version = "0.1.0"
description = "Rigorous proof and computation audit for linear loop thresholds"
requires-python = ">=3.12,<3.13"
dependencies = [
  "hypothesis>=6.100",
  "matplotlib>=3.10",
  "mpmath>=1.3",
  "numpy>=2.0",
  "pytest>=8.0",
  "scipy>=1.14",
  "sympy>=1.13",
]

[project.optional-dependencies]
folding = [
    "viennarna==2.7.2",
]
communication = [
    "rapidfuzz>=3.9,<4",
    "reedsolo==1.7.0",
]

[dependency-groups]
dev = ["ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
